<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A person sitting at a desk with their head in their hands">
  <defs>
    <linearGradient id="roomBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#roomBg)"/>

  <!-- window at night -->
  <rect x="520" y="60" width="220" height="180" rx="10" fill="#0F172A" stroke="#475569" stroke-width="6"/>
  <g fill="#FBBF24" opacity="0.8">
    <rect x="548" y="150" width="14" height="18"/>
    <rect x="584" y="120" width="14" height="18"/>
    <rect x="640" y="168" width="14" height="18"/>
    <rect x="690" y="110" width="14" height="18"/>
  </g>

  <!-- desk -->
  <rect x="60" y="420" width="680" height="26" rx="8" fill="#8B5E3C"/>
  <rect x="100" y="446" width="22" height="110" fill="#6B4527"/>
  <rect x="678" y="446" width="22" height="110" fill="#6B4527"/>

  <!-- laptop -->
  <g transform="translate(430 300)">
    <rect x="0" y="0" width="210" height="130" rx="10" fill="#111827" stroke="#475569" stroke-width="5"/>
    <rect x="12" y="12" width="186" height="106" rx="6" fill="url(#screenGlow)" opacity="0.85"/>
    <rect x="-18" y="130" width="246" height="14" rx="7" fill="#1F2937"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(330 378)">
    <rect x="0" y="0" width="40" height="42" rx="6" fill="#F8FAFC"/>
    <path d="M40 10 h12 a10 10 0 0 1 0 22 h-12 z" fill="none" stroke="#F8FAFC" stroke-width="6"/>
  </g>

  <!-- person with head in hands -->
  <g transform="translate(220 250)">
    <rect x="-70" y="120" width="140" height="150" rx="40" fill="#3F6FA3"/>
    <circle cx="0" cy="56" r="52" fill="#E8B183"/>
    <path d="M-52 40 a52 52 0 0 1 104 0 q-52 -28 -104 0 z" fill="#2A2A33"/>
    <!-- hands covering the face -->
    <rect x="-56" y="42" width="48" height="60" rx="22" fill="#F0C49C" transform="rotate(-12 -56 42)"/>
    <rect x="10" y="42" width="48" height="60" rx="22" fill="#F0C49C" transform="rotate(12 10 42)"/>
    <!-- arms down to the desk -->
    <rect x="-104" y="104" width="54" height="104" rx="26" fill="#3F6FA3" transform="rotate(18 -104 104)"/>
    <rect x="52" y="104" width="54" height="104" rx="26" fill="#3F6FA3" transform="rotate(-18 52 104)"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#E2E8F0">
    Failure / stress — namuna rasm
  </text>
</svg>
