<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Hands holding a phone with a navigation app behind a car steering wheel">
  <defs>
    <linearGradient id="carBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B3442"/>
      <stop offset="100%" stop-color="#171D26"/>
    </linearGradient>
    <linearGradient id="windscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FC6DE"/>
      <stop offset="100%" stop-color="#D7E8F1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#carBg)"/>

  <!-- windscreen -->
  <path d="M60 30 H740 L700 250 H100 Z" fill="url(#windscreen)" opacity="0.9"/>
  <path d="M120 250 H680 L660 300 H140 Z" fill="#20283A"/>

  <!-- dashboard -->
  <path d="M0 300 H800 V600 H0 Z" fill="#232B36"/>
  <rect x="470" y="330" width="230" height="130" rx="14" fill="#141A22" stroke="#3A4453" stroke-width="5"/>
  <g fill="#3A4453">
    <rect x="492" y="352" width="80" height="12" rx="6"/>
    <rect x="492" y="382" width="140" height="12" rx="6"/>
    <rect x="492" y="412" width="110" height="12" rx="6"/>
  </g>

  <!-- steering wheel -->
  <g transform="translate(300 420)">
    <circle r="190" fill="none" stroke="#111720" stroke-width="40"/>
    <circle r="62" fill="#1B222C"/>
    <rect x="-190" y="-18" width="128" height="36" rx="18" fill="#1B222C"/>
    <rect x="62" y="-18" width="128" height="36" rx="18" fill="#1B222C"/>
    <rect x="-20" y="62" width="40" height="120" rx="18" fill="#1B222C"/>
  </g>

  <!-- phone with a navigation map -->
  <g transform="translate(330 300)">
    <rect x="0" y="0" width="150" height="250" rx="20" fill="#0B0F15" stroke="#394455" stroke-width="5"/>
    <rect x="10" y="12" width="130" height="226" rx="14" fill="#E9F1E8"/>
    <!-- roads -->
    <g stroke="#CBD9CC" stroke-width="10" fill="none">
      <path d="M18 70 H140"/>
      <path d="M18 170 H140"/>
      <path d="M58 18 V236"/>
      <path d="M108 18 V236"/>
    </g>
    <!-- highlighted route -->
    <path d="M34 226 V170 H108 V70 H132" stroke="#2F7CF6" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="222" r="12" fill="#2F7CF6" stroke="#fff" stroke-width="4"/>
    <path d="M132 58 l12 14 -12 14 -12 -14 z" fill="#E0574B"/>
  </g>

  <!-- hands -->
  <g fill="#E8B183">
    <path d="M250 470 q60 -40 108 -58 l26 44 q-56 22 -96 56 z"/>
    <rect x="236" y="494" width="92" height="40" rx="20" transform="rotate(-18 236 494)"/>
    <path d="M470 440 q-50 -24 -92 -30 l-14 46 q44 8 86 30 z"/>
    <rect x="452" y="452" width="92" height="40" rx="20" transform="rotate(16 452 452)"/>
  </g>
  <g fill="#2E3A4A">
    <rect x="196" y="508" width="70" height="52" rx="16" transform="rotate(-18 196 508)"/>
    <rect x="516" y="470" width="70" height="52" rx="16" transform="rotate(16 516 470)"/>
  </g>

  <text x="400" y="578" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#E2E8F0">
    GPS navigation — namuna rasm
  </text>
</svg>
